#cloud-init
# 由 launch.ps1 渲染后再喂给 multipass launch --cloud-init
# 占位符在 write_files 段:TMUX_CONF_PLACEHOLDER 和 SSH_PUBKEY_PLACEHOLDER
# (注意:不要在注释里重复出现占位符字面量,会被 .Replace 误伤)

hostname: claude-dev
users:
  - default   # 用现成的 ubuntu 用户(非 root, 免密 sudo, claude-code 不拒绝)

package_update: true
packages:
  - git
  - curl
  - wget
  - vim
  - less
  - jq
  - ripgrep
  - fd-find
  - tmux
  - openssh-server
  - sudo
  - locales
  - ca-certificates

write_files:
  # TUI 渲染修复(替代原 Dockerfile 第 43 行的 /etc/bash.bashrc 写入)
  - path: /etc/profile.d/00-tui-env.sh
    permissions: '0644'
    content: |
      export TERM=xterm-256color
      export COLORTERM=truecolor
      export LANG=C.UTF-8
      export LC_ALL=C.UTF-8

  # settings.json 同步: 宿主机挂载的 .claude-host → VM 实际 .claude/(VM 内只读)
  # 白名单过滤:只提取 LLM 相关 env,其余字段(statusLine/mcpServers/hooks/permissions 等)不进 VM,VM 用 Claude Code 默认
  - path: /etc/profile.d/05-claude-config.sh
    permissions: '0644'
    content: |
      # 把宿主机 cc-switch 的 LLM env 同步进 VM 的 settings.json(只读),其余字段一律丢弃
      sync_claude_config() {
        [ -f "$HOME/.claude-host/settings.json" ] || return 0
        mkdir -p "$HOME/.claude"
        # 白名单:只保留 env(LLM token/base_url/模型等);非 JSON 时退化为空 env,保证能启动
        { jq '{env: (.env // {})}' "$HOME/.claude-host/settings.json" 2>/dev/null || echo '{"env":{}}'; } \
          > "$HOME/.claude/settings.json.tmp"
        # rm 绕过前次 chmod 444,再设 444 让 Claude Code 在 VM 里改不了
        rm -f "$HOME/.claude/settings.json"
        mv "$HOME/.claude/settings.json.tmp" "$HOME/.claude/settings.json"
        chmod 444 "$HOME/.claude/settings.json"
      }
      # 登录 shell 先同步一次(新开 shell 即生效)
      sync_claude_config
      # 每次敲 claude 前重新同步,cc-switch 切 provider 后同一 shell 也能立即生效
      claude() {
        sync_claude_config
        command claude "$@"
      }

  # 兜底:非登录交互 shell(tmux 新窗口等)也加载 claude 同步函数
  # (登录 shell 会经由 profile.d + bash.bashrc 各 source 一次,幂等无副作用)
  - path: /etc/bash.bashrc
    append: true
    permissions: '0644'
    content: |
      [ -f /etc/profile.d/05-claude-config.sh ] && . /etc/profile.d/05-claude-config.sh

  # 把 ~/.local/bin 加进 PATH(cc-pocket-daemon 装在这里,否则敲不出来)
  - path: /etc/profile.d/06-local-bin.sh
    permissions: '0644'
    content: |
      case ":$PATH:" in
        *":$HOME/.local/bin:"*) ;;
        *) export PATH="$HOME/.local/bin:$PATH" ;;
      esac

  # tmux 配置(launch.ps1 把 tmux.conf 内容渲染进来)
  # defer: true —— 等默认 ubuntu 用户创建后再写,避免 owner 失败
  # 注意:占位符必须顶格(0 缩进),由 launch.ps1 给每行加 6 空格缩进
  - path: /home/ubuntu/.tmux.conf
    defer: true
    permissions: '0644'
    owner: ubuntu:ubuntu
    content: |
{{TMUX_CONF_PLACEHOLDER}}

runcmd:
  # 追加 launch.ps1 生成的公钥到现有 authorized_keys
  # (不能用 write_files,会覆盖 Multipass 自带 key,把 multipass exec/shell 弄坏)
  - echo "{{SSH_PUBKEY_PLACEHOLDER}}" >> /home/ubuntu/.ssh/authorized_keys
  - chown ubuntu:ubuntu /home/ubuntu/.ssh/authorized_keys
  - chmod 600 /home/ubuntu/.ssh/authorized_keys
  - locale-gen C.UTF-8
  - update-locale LANG=C.UTF-8
  # Node 20(LTS)
  - curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
  - apt-get install -y nodejs
  # Claude Code
  - npm install -g @anthropic-ai/claude-code
  # (可选 Docker — 需要时取消下面 3 行注释,然后 ./launch.ps1 delete && ./launch.ps1 start)
  # - apt-get install -y docker.io
  # - usermod -aG docker ubuntu
  # - systemctl enable --now docker
  # cc-pocket daemon(手机遥控 Claude Code;自带 JRE,只需 curl+tar)
  # 装到 ~/.local/share/cc-pocket/,软链到 ~/.local/bin/cc-pocket-daemon
  # 用 ubuntu 用户跑(不能 root);配对进 VM 跑 cc-pocket-daemon pair
  # install.sh 里的 systemctl --user 在 cloud-init 阶段多半注册不上(没 D-Bus user session),
  # 不影响 daemon 文件落地,首次 pair 时会真正起来 + 完成服务注册
  - loginctl enable-linger ubuntu
  - sudo -u ubuntu bash -c 'curl -fsSL https://raw.githubusercontent.com/heypandax/cc-pocket/main/scripts/install.sh | bash'

final_message: "claude-dev cloud-init done after $UPTIME seconds"
