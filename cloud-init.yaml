#cloud-init
# 由 launch.ps1 渲染后再喂给 multipass launch --cloud-init
# 占位符(渲染时由 launch.ps1 替换):TMUX_CONF_PLACEHOLDER, SSH_PUBKEY_PLACEHOLDER, TAILSCALE_BLOCK, APT_MIRROR_PLACEHOLDER
# (注意:不要在注释里重复出现占位符字面量,会被 .Replace 误伤)

hostname: claude-dev
users:
  - default   # 用现成的 ubuntu 用户(非 root, 免密 sudo, claude-code 不拒绝)

# Multipass exec/mount 在 runcmd 之前就需要 SSH key，必须由 cloud-init 顶层注入。
ssh_authorized_keys:
  - "{{SSH_PUBKEY_PLACEHOLDER}}"

# APT 源需要在 cloud-init 的 apt 配置阶段之前覆盖，避免 runcmd 太晚。
apt:
  preserve_sources_list: false
  primary:
    - arches: [default]
      uri: https://{{APT_MIRROR_PLACEHOLDER}}/ubuntu
  security:
    - arches: [default]
      uri: https://{{APT_MIRROR_PLACEHOLDER}}/ubuntu

# apt update 在慢网络下耗时 1-2 分钟纯浪费。基础包在 runcmd 中逐个安装,
# 这样 launch.ps1 可以显示每个包的真实完成进度。
package_update: false


write_files:
  # TUI 渲染修复(替代原 Dockerfile 第 43 行的 /etc/bash.bashrc 写入)
  - path: /etc/profile.d/00-tui-env.sh
    permissions: '0644'
    content: |
      export TERM=xterm-256color
      export COLORTERM=truecolor
      export LANG=C.UTF-8
      export LC_ALL=C.UTF-8

  # settings.json 同步: 宿主机挂载的 .claude-host → VM 实际 .claude/(VM 内只读)
  # 白名单过滤:只提取 LLM 相关 env,其余字段(statusLine/mcpServers/hooks/permissions 等)不进 VM,VM 用 Claude Code 默认
  # 注:此文件不依赖 06-local-bin.sh 的 PATH(claude 是 npm 全局,不是 ~/.local/bin)
  - path: /etc/profile.d/05-claude-config.sh
    permissions: '0644'
    content: |
      # 把宿主机 cc-switch 的 LLM env 同步进 VM 的 settings.json(只读),其余字段一律丢弃
      sync_claude_config() {
        [ -f "$HOME/.claude-host/settings.json" ] || return 0
        mkdir -p "$HOME/.claude"
        # 白名单:只保留 env(LLM token/base_url/模型等);非 JSON 时退化为空 env,保证能启动
        { jq '{env: (.env // {})}' "$HOME/.claude-host/settings.json" 2>/dev/null || echo '{"env":{}}'; } \
          > "$HOME/.claude/settings.json.tmp"
        # rm 绕过前次 chmod 444,再设 444 让 Claude Code 在 VM 里改不了
        rm -f "$HOME/.claude/settings.json"
        mv "$HOME/.claude/settings.json.tmp" "$HOME/.claude/settings.json"
        chmod 444 "$HOME/.claude/settings.json"
      }
      # 登录 shell 先同步一次(新开 shell 即生效)
      sync_claude_config
      # 每次敲 claude 前重新同步,cc-switch 切 provider 后同一 shell 也能立即生效
      claude() {
        sync_claude_config
        command claude "$@"
      }

  # 兜底:非登录交互 shell(tmux 新窗口等)也加载 claude 同步函数
  # (登录 shell 会经由 profile.d + bash.bashrc 各 source 一次,幂等无副作用)
  - path: /etc/bash.bashrc
    append: true
    permissions: '0644'
    content: |
      [ -f /etc/profile.d/05-claude-config.sh ] && . /etc/profile.d/05-claude-config.sh

  # 把 ~/.local/bin 加进 PATH(cc-pocket-daemon 装在这里,否则敲不出来)
  - path: /etc/profile.d/06-local-bin.sh
    permissions: '0644'
    content: |
      case ":$PATH:" in
        *":$HOME/.local/bin:"*) ;;
        *) export PATH="$HOME/.local/bin:$PATH" ;;
      esac

  # Fish 交互体验:灰色历史建议(右方向键/Ctrl+F 接受);启动 Claude 前同步 cc-switch env
  # 跟 bash wrapper(05-claude-config.sh)共用同一份逻辑:读 .claude-host → jq 过滤 env → 写 ~/.claude/settings.json 444
  - path: /home/ubuntu/.config/fish/config.fish
    defer: true
    permissions: '0644'
    owner: ubuntu:ubuntu
    content: |
      fish_add_path $HOME/.local/bin
      zoxide init fish | source
      function sync_claude_config
          if not test -f "$HOME/.claude-host/settings.json"
              return 0
          end
          mkdir -p "$HOME/.claude"
          if not jq '{env: (.env // {})}' "$HOME/.claude-host/settings.json" > "$HOME/.claude/settings.json.tmp" 2>/dev/null
              echo '{"env":{}}' > "$HOME/.claude/settings.json.tmp"
          end
          rm -f "$HOME/.claude/settings.json"
          mv "$HOME/.claude/settings.json.tmp" "$HOME/.claude/settings.json"
          chmod 444 "$HOME/.claude/settings.json"
      end
      function claude
          sync_claude_config
          command claude $argv
      end

  # tmux 配置(launch.ps1 把 tmux.conf 内容渲染进来)
  # defer: true —— 等默认 ubuntu 用户创建后再写,避免 owner 失败
  # 注意:占位符必须顶格(0 缩进),由 launch.ps1 给每行加 6 空格缩进
  - path: /home/ubuntu/.tmux.conf
    defer: true
    permissions: '0644'
    owner: ubuntu:ubuntu
    content: |
{{TMUX_CONF_PLACEHOLDER}}

runcmd:
  - printf '%s\n' 'event=APT 镜像源：{{APT_MIRROR_PLACEHOLDER}}' >> /run/claude-dev/events
  # 启动早期切换 APT 源；Ubuntu 24.04 使用 deb822 ubuntu.sources
  - |
    if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
      sed -i -E 's#https?://[^ ]+#https://{{APT_MIRROR_PLACEHOLDER}}/ubuntu#g' /etc/apt/sources.list.d/ubuntu.sources
    elif [ -f /etc/apt/sources.list ]; then
      sed -i -E 's#https?://[^ ]+/ubuntu#https://{{APT_MIRROR_PLACEHOLDER}}/ubuntu#g' /etc/apt/sources.list
    fi
  - mkdir -p /run/claude-dev
  - chmod 755 /run/claude-dev
  - 'touch /run/claude-dev/progress'
  - 'touch /run/claude-dev/packages'
  - touch /run/claude-dev/events
  - printf '%s\n' 'event=stage:1|[1/6] 安装系统基础包' >> /run/claude-dev/events
  - printf '%s\n' 'stage=1' 'package=0' 'package_name=starting' > /run/claude-dev/progress
  # 系统包逐个安装；packages 文件记录全部已完成包，避免快速步骤被轮询错过
  - apt-get install -y git && printf '%s\n' git >> /run/claude-dev/packages && printf '%s\n' 'stage=1' 'package=1' 'package_name=git' > /run/claude-dev/progress
  - apt-get install -y curl && printf '%s\n' curl >> /run/claude-dev/packages && printf '%s\n' 'stage=1' 'package=2' 'package_name=curl' > /run/claude-dev/progress
  - apt-get install -y wget && printf '%s\n' wget >> /run/claude-dev/packages && printf '%s\n' 'stage=1' 'package=3' 'package_name=wget' > /run/claude-dev/progress
  - apt-get install -y vim && printf '%s\n' vim >> /run/claude-dev/packages && printf '%s\n' 'stage=1' 'package=4' 'package_name=vim' > /run/claude-dev/progress
  - apt-get install -y less && printf '%s\n' less >> /run/claude-dev/packages && printf '%s\n' 'stage=1' 'package=5' 'package_name=less' > /run/claude-dev/progress
  - apt-get install -y jq && printf '%s\n' jq >> /run/claude-dev/packages && printf '%s\n' 'stage=1' 'package=6' 'package_name=jq' > /run/claude-dev/progress
  - apt-get install -y ripgrep && printf '%s\n' ripgrep >> /run/claude-dev/packages && printf '%s\n' 'stage=1' 'package=7' 'package_name=ripgrep' > /run/claude-dev/progress
  - apt-get install -y fd-find && printf '%s\n' fd-find >> /run/claude-dev/packages && printf '%s\n' 'stage=1' 'package=8' 'package_name=fd-find' > /run/claude-dev/progress
  - apt-get install -y tmux && printf '%s\n' tmux >> /run/claude-dev/packages && printf '%s\n' 'stage=1' 'package=9' 'package_name=tmux' > /run/claude-dev/progress
  - apt-get install -y fish && printf '%s\n' fish >> /run/claude-dev/packages && printf '%s\n' 'stage=1' 'package=10' 'package_name=fish' > /run/claude-dev/progress
  - chsh -s /usr/bin/fish ubuntu
  - apt-get install -y fzf && printf '%s\n' fzf >> /run/claude-dev/packages && printf '%s\n' 'stage=1' 'package=11' 'package_name=fzf' > /run/claude-dev/progress
  - apt-get install -y zoxide && printf '%s\n' zoxide >> /run/claude-dev/packages && printf '%s\n' 'stage=1' 'package=12' 'package_name=zoxide' > /run/claude-dev/progress
  - apt-get install -y openssh-server && printf '%s\n' openssh-server >> /run/claude-dev/packages && printf '%s\n' 'stage=1' 'package=13' 'package_name=openssh-server' > /run/claude-dev/progress
  - apt-get install -y sudo && printf '%s\n' sudo >> /run/claude-dev/packages && printf '%s\n' 'stage=1' 'package=14' 'package_name=sudo' > /run/claude-dev/progress
  - apt-get install -y locales && printf '%s\n' locales >> /run/claude-dev/packages && printf '%s\n' 'stage=1' 'package=15' 'package_name=locales' > /run/claude-dev/progress
  - apt-get install -y ca-certificates && printf '%s\n' ca-certificates >> /run/claude-dev/packages && printf '%s\n' 'stage=1' 'package=16' 'package_name=ca-certificates' > /run/claude-dev/progress
  - printf '%s\n' 'stage=1' 'package=16' 'package_name=done' > /run/claude-dev/progress
  # 追加 launch.ps1 生成的公钥到现有 authorized_keys
  # (不能用 write_files,会覆盖 Multipass 自带 key,把 multipass exec/shell 弄坏)
  - echo "{{SSH_PUBKEY_PLACEHOLDER}}" >> /home/ubuntu/.ssh/authorized_keys
  - chown ubuntu:ubuntu /home/ubuntu/.ssh/authorized_keys
  - chmod 600 /home/ubuntu/.ssh/authorized_keys
  - locale-gen C.UTF-8
  - update-locale LANG=C.UTF-8
  # 第一阶段只配置基础交互环境；bundle 挂载和离线软件安装由 launch.ps1 后续执行
  - printf '%s\n' 'stage=4' 'package=1' 'package_name=Fish 配置完成' > /run/claude-dev/progress && printf '%s\n' 'event=Fish 配置完成' >> /run/claude-dev/events
  - printf '%s\n' 'stage=4' 'package=2' 'package_name=tmux 配置完成' > /run/claude-dev/progress && printf '%s\n' 'event=tmux 配置完成' >> /run/claude-dev/events
  - printf '%s\n' 'stage=4' 'package=3' 'package_name=SSH 配置完成' > /run/claude-dev/progress && printf '%s\n' 'event=SSH 配置完成' >> /run/claude-dev/events
  - printf '%s\n' 'stage=4' 'package=4' 'package_name=Claude 配置同步逻辑完成' > /run/claude-dev/progress && printf '%s\n' 'event=Claude 配置同步逻辑完成' >> /run/claude-dev/events
  - printf '%s\n' 'event=基础 cloud-init 完成，等待 bundle 挂载' >> /run/claude-dev/events
