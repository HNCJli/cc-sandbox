#cloud-init
# 由 launch.ps1 渲染后再喂给 multipass launch --cloud-init
# 占位符(渲染时由 launch.ps1 替换):TMUX_CONF_PLACEHOLDER, SSH_PUBKEY_PLACEHOLDER, TAILSCALE_BLOCK, APT_MIRROR_PLACEHOLDER, STATUSLINE_PLACEHOLDER, BASE_PACKAGES_RUNCMD
# (注意:注释里别出现 {{XXX}} 形式的占位符,launch.ps1 的 .Replace 会连注释一起替换;不带花括号的裸名安全)

hostname: claude-dev
users:
  - default   # 用现成的 ubuntu 用户(非 root, 免密 sudo, claude-code 不拒绝)

# Multipass exec/mount 在 runcmd 之前就需要 SSH key，必须由 cloud-init 顶层注入。
ssh_authorized_keys:
  - "{{SSH_PUBKEY_PLACEHOLDER}}"

# APT 源需要在 cloud-init 的 apt 配置阶段之前覆盖，避免 runcmd 太晚。
apt:
  preserve_sources_list: false
  primary:
    - arches: [default]
      uri: https://{{APT_MIRROR_PLACEHOLDER}}/ubuntu
  security:
    - arches: [default]
      uri: https://{{APT_MIRROR_PLACEHOLDER}}/ubuntu

# apt update 在慢网络下耗时 1-2 分钟纯浪费。基础包在 runcmd 中逐个安装,
# 这样 launch.ps1 可以显示每个包的真实完成进度。
package_update: false


write_files:
  # TUI 渲染修复
  - path: /etc/profile.d/00-tui-env.sh
    permissions: '0644'
    content: |
      export TERM=xterm-256color
      export COLORTERM=truecolor
      export LANG=C.UTF-8
      export LC_ALL=C.UTF-8

  # settings.json 同步: 宿主机挂载的 .claude-host → VM 实际 .claude/(VM 内只读)
  # 白名单过滤:提取 LLM 相关 env + 注入 VM 本地 statusLine;mcpServers/hooks/permissions 等一律丢弃
  # 注:此文件不依赖 06-local-bin.sh 的 PATH(claude 在 /usr/local/bin,不是 ~/.local/bin)
  - path: /etc/profile.d/05-claude-config.sh
    permissions: '0644'
    content: |
      # 把宿主机 cc-switch 的 LLM env 同步进 VM 的 settings.json(只读),其余字段一律丢弃
      sync_claude_config() {
        [ -f "$HOME/.claude-host/settings.json" ] || return 0
        mkdir -p "$HOME/.claude"
        # 白名单:只保留 env(LLM token/base_url/模型等);非 JSON 时退化为空 env,保证能启动
        { jq '{env: (.env // {}), statusLine: {type: "command", command: "/home/ubuntu/.claude-statusline.sh", padding: 0}}' "$HOME/.claude-host/settings.json" 2>/dev/null || echo '{"env":{},"statusLine":{"type":"command","command":"/home/ubuntu/.claude-statusline.sh","padding":0}}'; } \
          > "$HOME/.claude/settings.json.tmp"
        # rm 绕过前次 chmod 444,再设 444 让 Claude Code 在 VM 里改不了
        rm -f "$HOME/.claude/settings.json"
        mv "$HOME/.claude/settings.json.tmp" "$HOME/.claude/settings.json"
        chmod 444 "$HOME/.claude/settings.json"
      }
      # 登录 shell 先同步一次(新开 shell 即生效)
      sync_claude_config
      # 每次敲 claude 前重新同步,cc-switch 切 provider 后同一 shell 也能立即生效
      claude() {
        sync_claude_config
        command claude "$@"
      }

  # 兜底:非登录交互 shell(tmux 新窗口等)也加载 claude / opencode 同步函数
  # (登录 shell 会经由 profile.d + bash.bashrc 各 source 一次,幂等无副作用)
  - path: /etc/bash.bashrc
    append: true
    permissions: '0644'
    content: |
      [ -f /etc/profile.d/05-claude-config.sh ] && . /etc/profile.d/05-claude-config.sh
      [ -f /etc/profile.d/07-opencode-config.sh ] && . /etc/profile.d/07-opencode-config.sh

  # 把 ~/.local/bin 加进 PATH(cc-pocket-daemon 装在这里,否则敲不出来)
  - path: /etc/profile.d/06-local-bin.sh
    permissions: '0644'
    content: |
      case ":$PATH:" in
        *":$HOME/.local/bin:"*) ;;
        *) export PATH="$HOME/.local/bin:$PATH" ;;
      esac

  # opencode 配置同步:与 05-claude-config.sh 同源同链路(cc-switch 的 env 经反向隧道,
  # VM 里 127.0.0.1:PORT 与 claude 同样可达),生成 VM 本地 ~/.config/opencode/opencode.json。
  # 读不到 base_url/token(公网直连/宿主无 cc-switch)时不写配置,opencode 走自身 auth
  - path: /etc/profile.d/07-opencode-config.sh
    permissions: '0644'
    content: |
      # 把宿主机 cc-switch 的 LLM env 同步进 opencode 配置(每次敲 opencode 前重新生成)。
      # 模型表:注册 Claude Code 全部模型别名字段(MODEL/OPUS/SONNET/HAIKU/FABLE/SUBAGENT),
      # 按值去重——别名映射到不同模型时 opencode 里可随时切;默认模型 = ANTHROPIC_MODEL
      sync_opencode_config() {
          [ -f "$HOME/.claude-host/settings.json" ] || return 0
          _oc_base=$(jq -r '.env.ANTHROPIC_BASE_URL // empty' "$HOME/.claude-host/settings.json" 2>/dev/null)
          _oc_key=$(jq -r '.env.ANTHROPIC_AUTH_TOKEN // .env.ANTHROPIC_API_KEY // empty' "$HOME/.claude-host/settings.json" 2>/dev/null)
          [ -n "$_oc_base" ] && [ -n "$_oc_key" ] || return 0
          # @ai-sdk/anthropic 从 baseURL 追加 /messages(Claude Code 追加 /v1/messages),
          # 宿主机 base_url 须补 /v1 才打到同一网关路径;已带 /v1 不重复加
          case "$_oc_base" in
              */v1) ;;
              */) _oc_base="${_oc_base}v1" ;;
              *)   _oc_base="$_oc_base/v1" ;;
          esac
          mkdir -p "$HOME/.config/opencode"
          jq -n --arg b "$_oc_base" --arg k "$_oc_key" --rawfile cfg "$HOME/.claude-host/settings.json" '
              (($cfg | fromjson | .env) // {}) as $e
              | (if ($e.ANTHROPIC_MODEL // "") == "" then "claude-sonnet-4-5" else $e.ANTHROPIC_MODEL end) as $dflt
              | [ $dflt,
                  $e.ANTHROPIC_DEFAULT_OPUS_MODEL   // "",
                  $e.ANTHROPIC_DEFAULT_SONNET_MODEL // "",
                  $e.ANTHROPIC_DEFAULT_HAIKU_MODEL  // "",
                  $e.ANTHROPIC_DEFAULT_FABLE_MODEL  // "",
                  $e.CLAUDE_CODE_SUBAGENT_MODEL     // "" ]
                | map(select(. != "")) | unique
                | map({ key: ., value: { name: . } }) | from_entries
                | {
                    "$schema": "https://opencode.ai/config.json",
                    "provider": {
                        "cc-switch": {
                            "npm": "@ai-sdk/anthropic",
                            "options": { "baseURL": $b, "apiKey": $k },
                            "models": .
                        }
                    },
                    "model": ("cc-switch/" + $dflt)
                  }
              ' > "$HOME/.config/opencode/opencode.json.tmp"
          mv "$HOME/.config/opencode/opencode.json.tmp" "$HOME/.config/opencode/opencode.json"
      }
      sync_opencode_config
      # 每次敲 opencode 前重新同步(与 claude() 同款),cc-switch 切换后同一 shell 立即生效
      opencode() {
          sync_opencode_config
          command opencode "$@"
      }

  # Fish 交互体验:灰色历史建议(右方向键/Ctrl+F 接受);启动 Claude / opencode 前同步 cc-switch env
  # 跟 bash wrapper(05/07 profile.d)共用同一份逻辑:读 .claude-host → jq 过滤 env → 写 VM 本地配置
  - path: /home/ubuntu/.config/fish/config.fish
    defer: true
    permissions: '0644'
    owner: ubuntu:ubuntu
    content: |
      fish_add_path $HOME/.local/bin
      zoxide init fish | source
      function sync_claude_config
          if not test -f "$HOME/.claude-host/settings.json"
              return 0
          end
          mkdir -p "$HOME/.claude"
          if not jq '{env: (.env // {}), statusLine: {type: "command", command: "/home/ubuntu/.claude-statusline.sh", padding: 0}}' "$HOME/.claude-host/settings.json" > "$HOME/.claude/settings.json.tmp" 2>/dev/null
              echo '{"env":{},"statusLine":{"type":"command","command":"/home/ubuntu/.claude-statusline.sh","padding":0}}' > "$HOME/.claude/settings.json.tmp"
          end
          rm -f "$HOME/.claude/settings.json"
          mv "$HOME/.claude/settings.json.tmp" "$HOME/.claude/settings.json"
          chmod 444 "$HOME/.claude/settings.json"
      end
      function claude
          sync_claude_config
          command claude $argv
      end
      function sync_opencode_config
          if not test -f "$HOME/.claude-host/settings.json"
              return 0
          end
          set -l base_url (jq -r '.env.ANTHROPIC_BASE_URL // empty' "$HOME/.claude-host/settings.json" 2>/dev/null)
          set -l api_key (jq -r '.env.ANTHROPIC_AUTH_TOKEN // .env.ANTHROPIC_API_KEY // empty' "$HOME/.claude-host/settings.json" 2>/dev/null)
          if test -z "$base_url"; or test -z "$api_key"
              return 0
          end
          # baseURL 补 /v1(同 bash 版:@ai-sdk/anthropic 与 Claude Code 的路径差异);模型注册同 bash 版
          if not string match -q -- '*/v1' "$base_url"
              if string match -q -- '*/' "$base_url"
                  set base_url "$base_url"v1
              else
                  set base_url "$base_url"/v1
              end
          end
          mkdir -p "$HOME/.config/opencode"
          jq -n --arg b "$base_url" --arg k "$api_key" --rawfile cfg "$HOME/.claude-host/settings.json" '(($cfg | fromjson | .env) // {}) as $e | (if ($e.ANTHROPIC_MODEL // "") == "" then "claude-sonnet-4-5" else $e.ANTHROPIC_MODEL end) as $dflt | [ $dflt, $e.ANTHROPIC_DEFAULT_OPUS_MODEL // "", $e.ANTHROPIC_DEFAULT_SONNET_MODEL // "", $e.ANTHROPIC_DEFAULT_HAIKU_MODEL // "", $e.ANTHROPIC_DEFAULT_FABLE_MODEL // "", $e.CLAUDE_CODE_SUBAGENT_MODEL // "" ] | map(select(. != "")) | unique | map({ key: ., value: { name: . } }) | from_entries | { "$schema": "https://opencode.ai/config.json", "provider": { "cc-switch": { "npm": "@ai-sdk/anthropic", "options": { "baseURL": $b, "apiKey": $k }, "models": . } }, "model": ("cc-switch/" + $dflt) }' > "$HOME/.config/opencode/opencode.json.tmp"
          mv "$HOME/.config/opencode/opencode.json.tmp" "$HOME/.config/opencode/opencode.json"
      end
      function opencode
          sync_opencode_config
          command opencode $argv
      end

  # Claude Code statusline 脚本(bash,launch.ps1 渲染进来)
  # sync_claude_config 会把 statusLine 字段写进 ~/.claude/settings.json 指向此文件
  - path: /home/ubuntu/.claude-statusline.sh
    defer: true
    permissions: '0755'
    owner: ubuntu:ubuntu
    content: |
{{STATUSLINE_PLACEHOLDER}}

  # tmux 配置(launch.ps1 把 tmux.conf 内容渲染进来)
  # defer: true —— 等默认 ubuntu 用户创建后再写,避免 owner 失败
  # 注意:占位符必须顶格(0 缩进),由 launch.ps1 给每行加 6 空格缩进
  - path: /home/ubuntu/.tmux.conf
    defer: true
    permissions: '0644'
    owner: ubuntu:ubuntu
    content: |
{{TMUX_CONF_PLACEHOLDER}}

runcmd:
  - printf '%s\n' 'event=APT 镜像源：{{APT_MIRROR_PLACEHOLDER}}' >> /run/claude-dev/events
  # 启动早期切换 APT 源；Ubuntu 24.04 使用 deb822 ubuntu.sources
  - |
    if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
      sed -i -E 's#https?://[^ ]+#https://{{APT_MIRROR_PLACEHOLDER}}/ubuntu#g' /etc/apt/sources.list.d/ubuntu.sources
    elif [ -f /etc/apt/sources.list ]; then
      sed -i -E 's#https?://[^ ]+/ubuntu#https://{{APT_MIRROR_PLACEHOLDER}}/ubuntu#g' /etc/apt/sources.list
    fi
  - mkdir -p /run/claude-dev
  - chmod 755 /run/claude-dev
  - 'touch /run/claude-dev/progress'
  - 'touch /run/claude-dev/packages'
  - touch /run/claude-dev/events
  - printf '%s\n' 'event=stage:1|[1/7] 安装系统基础包' >> /run/claude-dev/events
  - printf '%s\n' 'stage=1' 'package=0' 'package_name=starting' > /run/claude-dev/progress
  # 基础包逐个安装块由 launch.ps1 按 $basePackages 清单渲染(单一来源,与进度显示同源)。
  # 勿在此手写包行——增减基础包改 launch.ps1 的 $basePackages。
  # packages 文件记录全部已完成包，避免快速步骤被轮询错过
{{BASE_PACKAGES_RUNCMD}}
  - chsh -s /usr/bin/fish ubuntu
  # 追加 launch.ps1 生成的公钥到现有 authorized_keys
  # (不能用 write_files,会覆盖 Multipass 自带 key,把 multipass exec/shell 弄坏)
  - echo "{{SSH_PUBKEY_PLACEHOLDER}}" >> /home/ubuntu/.ssh/authorized_keys
  - chown ubuntu:ubuntu /home/ubuntu/.ssh/authorized_keys
  - chmod 600 /home/ubuntu/.ssh/authorized_keys
  - locale-gen C.UTF-8
  - update-locale LANG=C.UTF-8
  # 第一阶段只配置基础交互环境；bundle 传输和离线软件安装由 launch.ps1 后续执行
  - printf '%s\n' 'stage=4' 'package=1' 'package_name=Fish 配置完成' > /run/claude-dev/progress && printf '%s\n' 'event=Fish 配置完成' >> /run/claude-dev/events
  - printf '%s\n' 'stage=4' 'package=2' 'package_name=tmux 配置完成' > /run/claude-dev/progress && printf '%s\n' 'event=tmux 配置完成' >> /run/claude-dev/events
  - printf '%s\n' 'stage=4' 'package=3' 'package_name=SSH 配置完成' > /run/claude-dev/progress && printf '%s\n' 'event=SSH 配置完成' >> /run/claude-dev/events
  - printf '%s\n' 'stage=4' 'package=4' 'package_name=Claude 配置同步逻辑完成' > /run/claude-dev/progress && printf '%s\n' 'event=Claude 配置同步逻辑完成' >> /run/claude-dev/events
  # tailscale 安装插入点(顶格占位符,交互菜单勾选 tailscale 时在此注入安装命令)。
  # 勿删/勿改缩进:删了占位符就静默失效;缩进会叠加进注入块破坏 YAML。字面量别写进注释,Replace 会连注释一起替换
{{TAILSCALE_BLOCK}}
  - printf '%s\n' 'event=基础 cloud-init 完成，等待 bundle 传输' >> /run/claude-dev/events
