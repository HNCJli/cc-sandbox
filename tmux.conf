# 256 色 + true color 透传（修复 logo/边框颜色丢失）
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -ag terminal-features ",xterm-256color:RGB"

# 让 TUI 的 passthrough 序列正常透传
set -g allow-passthrough on

# 降低 escape 延迟，TUI 按键更跟手
set -g escape-time 10

# 鼠标支持
set -g mouse on

# 窗口/面板编号从 1 开始
set -g base-index 1
setw -g pane-base-index 1

# 把默认的 Prefix D（choose-client）改绑成 detach，用 Ctrl+B D 退出会话。
# 注：本环境实测小写 d 不触发 detach，故统一用大写 D。
bind D detach-client
